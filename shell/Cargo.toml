[package]
name = "nyx-shell"
version = "0.1.0"
edition = "2021"
description = "Wayland shell for Nyx: top bar, app launcher, and panels"
license = "MIT"

[[bin]]
name = "nyx-shell"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
  "std",
  "renderer-software",
  "software-renderer-systemfonts",
  "compat-1-2",
] }
wayland-client = "0.31"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-protocols-wlr = "0.3"
calloop = "0.14"
calloop-wayland-source = "0.4"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.18"
